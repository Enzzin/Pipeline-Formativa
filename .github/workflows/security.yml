# .github/workflows/security.yml
name: Security Pipeline (SAST + SCA)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — SAST com Semgrep
  # ─────────────────────────────────────────────
  sast-semgrep:
    name: "SAST — Semgrep"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    container:
      image: semgrep/semgrep

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Rodar Semgrep CI (envia para semgrep.dev + regra customizada)"
        run: semgrep ci --config .semgrep/rules/python-logging.yml
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 2 — SCA com FOSSA
  # ─────────────────────────────────────────────
  sca-fossa:
    name: "SCA — FOSSA"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Analisar dependências e enviar para FOSSA"
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      - name: "Verificar compliance de licenças e vulnerabilidades"
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
