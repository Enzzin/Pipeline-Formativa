name: pipeline-simples

on:
  push:
    branches: [ "main" ]

jobs:
  integracao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Rodar testes
        run: pytest

      - name: Rodar Bandit
        run: bandit -r . -x ./venv,./.venv,./tests

  build-docker:
    runs-on: ubuntu-latest
    needs: integracao

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/formativa-pipeline:latest .

  push-docker:
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push da imagem
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/formativa-pipeline:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/formativa-pipeline:latest