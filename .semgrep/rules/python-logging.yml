
# .semgrep/rules/python-logging.yml
rules:
  - id: python-use-logger-not-print
    message: >
      Uso de Print Detectado, por favor use Loggin.
    languages:
      - python
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: print(...)
          - pattern: pprint.pprint(...)
          - pattern: pprint(...)
          - pattern: pp(...)
    paths:
      exclude:
        - tests/**
        - "**/test_*.py"
        - "**/*_test.py"
        - scripts/**
    metadata:
      category: best-practice
      technology:
        - python
      confidence: HIGH
      impact: LOW
      likelihood: MEDIUM
      references:
        - https://docs.python.org/3/library/logging.html
        - https://12factor.net/logs
